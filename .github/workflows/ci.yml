# Integration continue (lot alpha, piste 7) : les tests et la mesure de couverture tournent a chaque push
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler, lancer les tests et verifier la couverture (JaCoCo, 80 % des lignes minimum)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-jacoco
          path: target/site/jacoco/
