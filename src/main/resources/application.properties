spring.application.name=ras

# Surcharges locales non versionnees (mot de passe de la base en dev) : fichier ignore par Git
spring.config.import=optional:file:./application-local.properties

# Base de donnees : valeurs lues dans les variables d'environnement, jamais ecrites en dur (sujet, 7.7)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ras}
spring.datasource.username=${DB_USER:ras}
spring.datasource.password=${DB_PASSWORD:}

# Le schema est recree a chaque demarrage, puis rempli par les donnees de demonstration (config/DonneesDemo)
spring.jpa.hibernate.ddl-auto=create

# Les vues ne chargent rien en dehors des services : pas de session JPA ouverte pendant le rendu
spring.jpa.open-in-view=false

# Aucune trace technique affichee a l'utilisateur (sujet, 7.4)
server.error.include-stacktrace=never

# Port impose par l'hebergeur en production, 8080 en local
server.port=${PORT:8080}

# Derriere le proxy HTTPS de l'hebergeur : les redirections doivent garder https://
server.forward-headers-strategy=native
