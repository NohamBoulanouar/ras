<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil — RAS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="entete">
    <a class="logo" th:href="@{/}">RAS</a>
    <div class="entete-utilisateur">
        <span th:text="|Bonjour ${prenom} (${profil})|">Bonjour Claire (RESPONSABLE)</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bouton bouton-discret">Se déconnecter</button>
        </form>
    </div>
</header>
<main class="contenu">
    <h1>Accueil</h1>
    <p>Connexion réussie. Les écrans arrivent à l'étape suivante.</p>
</main>
</body>
</html>
